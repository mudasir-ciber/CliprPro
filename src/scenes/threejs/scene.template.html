<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scene: threejs (Phase 5+6)</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; width: 100%; height: 100%; }
  #stage { display: block; width: 100%; height: 100%; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
</head>
<body>
<canvas id="stage"></canvas>
<script type="module">
import * as THREE from 'three';

"use strict";
/*
 * THREE.JS SCENE — Phase 5 + Phase 6 cinematic camera
 * Deterministic WebGL: state is a pure function of `time` (seconds).
 * Seeded PRNG only; no wall-clock animation loops.
 */
const CFG = __SCENE_CONFIG__;
const W = CFG.width, H = CFG.height, D = CFG.durationSec;

function clamp(v, a = 0, b = 1) { return Math.min(b, Math.max(a, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

function easeCamera(t, name) {
  const x = clamp(t);
  if (name === 'linear') return x;
  if (name === 'ease-in') return x * x * x;
  if (name === 'ease-out') return 1 - Math.pow(1 - x, 3);
  return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
}

function evalCamera(cam, p, t) {
  cam = cam || {};
  const move = cam.move || 'static';
  const easeName = cam.ease || 'ease-in-out';
  const intensity = Number.isFinite(cam.intensity) ? cam.intensity : 0.5;
  const e = easeCamera(p, easeName);
  let zoom = Number.isFinite(cam.zoom) ? cam.zoom : 1;
  let panX = Number.isFinite(cam.panX) ? cam.panX : 0;
  let panY = Number.isFinite(cam.panY) ? cam.panY : 0;
  let roll = Number.isFinite(cam.roll) ? cam.roll : 0;
  let fov = Number.isFinite(cam.fov) ? cam.fov : 45;
  const baseZoom = zoom, basePanX = panX, basePanY = panY, baseRoll = roll, baseFov = fov;
  const k = intensity;
  if (cam.from && cam.to) {
    const a = cam.from, b = cam.to;
    const L = (u, v, w) => (Number.isFinite(u) ? u : w) + ((Number.isFinite(v) ? v : w) - (Number.isFinite(u) ? u : w)) * e;
    return { zoom: L(a.zoom, b.zoom, baseZoom), panX: L(a.panX, b.panX, basePanX), panY: L(a.panY, b.panY, basePanY), roll: L(a.roll, b.roll, baseRoll), fov: L(a.fov, b.fov, baseFov) };
  }
  if (move === 'dolly-in') { zoom = lerp(baseZoom * (1 - 0.12 * k), baseZoom * (1 + 0.14 * k), e); fov = lerp(baseFov + 4 * k, baseFov - 5 * k, e); }
  else if (move === 'dolly-out') { zoom = lerp(baseZoom * (1 + 0.1 * k), baseZoom * (1 - 0.1 * k), e); fov = lerp(baseFov - 3 * k, baseFov + 5 * k, e); }
  else if (move === 'orbit-left') { panX = basePanX + lerp(0.08 * k, -0.08 * k, e); panY = basePanY + Math.sin(e * Math.PI) * 0.02 * k; }
  else if (move === 'orbit-right') { panX = basePanX + lerp(-0.08 * k, 0.08 * k, e); panY = basePanY + Math.sin(e * Math.PI) * 0.02 * k; }
  else if (move === 'crane-up') { panY = basePanY + lerp(0.06 * k, -0.07 * k, e); zoom = lerp(baseZoom * 0.98, baseZoom * 1.04, e); }
  else if (move === 'crane-down') panY = basePanY + lerp(-0.05 * k, 0.06 * k, e);
  else if (move === 'handheld') {
    panX = basePanX + Math.sin(t * 7.3) * 0.012 * k + Math.sin(t * 3.1) * 0.006 * k;
    panY = basePanY + Math.cos(t * 6.1) * 0.01 * k;
    roll = baseRoll + Math.sin(t * 5.2) * 0.8 * k;
    zoom = baseZoom * (1 + Math.sin(t * 4.4) * 0.01 * k);
  } else if (move === 'push-slide') {
    panX = basePanX + lerp(-0.05 * k, 0.04 * k, e);
    zoom = lerp(baseZoom * 0.97, baseZoom * 1.06, e);
  } else if (move === 'whip-pan') {
    panX = basePanX + ((e < 0.15 || e > 0.85) ? Math.sin(t * 30) * 0.04 * k : lerp(-0.12 * k, 0.12 * k, e));
    roll = baseRoll + (e < 0.2 ? (1 - e / 0.2) * 3 * k : 0);
  }
  return { zoom, panX, panY, roll, fov };
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hexToColor(hex, fallback = '#6ea8ff') {
  try { return new THREE.Color(hex || fallback); } catch { return new THREE.Color(fallback); }
}

function wrapLines(ctx, text, maxWidth, maxLines) {
  const words = String(text || '').split(/\s+/);
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines.slice(0, maxLines);
}

function activeShot(t) {
  const list = CFG.shots || [];
  for (let i = 0; i < list.length; i++) {
    if (t >= list[i].start && t < list[i].end) return list[i];
  }
  if (list.length && t >= list[list.length - 1].start) return list[list.length - 1];
  return null;
}

function localProgress(shot, t) {
  if (!shot) return 0;
  return clamp((t - shot.start) / Math.max(1e-6, shot.end - shot.start));
}

const rng = mulberry32(CFG.seed === undefined ? 77 : CFG.seed);
const canvas = document.getElementById('stage');
canvas.width = W;
canvas.height = H;

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: false,
  preserveDrawingBuffer: true,
  powerPreference: 'high-performance'
});
renderer.setSize(W, H, false);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 200);
camera.position.set(0, 0.4, 7.2);

const amb = new THREE.AmbientLight(0xffffff, 0.45);
scene.add(amb);
const key = new THREE.DirectionalLight(0xffffff, 1.15);
key.position.set(4, 6, 5);
scene.add(key);
const rim = new THREE.PointLight(0x88aaff, 1.2, 30);
rim.position.set(-4, -2, 3);
scene.add(rim);

// Star / particle field (seeded)
const starGeo = new THREE.BufferGeometry();
const starCount = 420;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  starPos[i * 3] = (rng() - 0.5) * 28;
  starPos[i * 3 + 1] = (rng() - 0.5) * 18;
  starPos[i * 3 + 2] = (rng() - 0.5) * 18 - 4;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(
  starGeo,
  new THREE.PointsMaterial({ color: 0xffffff, size: 0.035, transparent: true, opacity: 0.75 })
);
scene.add(stars);

const root = new THREE.Group();
scene.add(root);

const meshMat = new THREE.MeshStandardMaterial({
  color: 0x6ea8ff,
  metalness: 0.35,
  roughness: 0.35,
  emissive: 0x102040,
  emissiveIntensity: 0.35
});
let hero = new THREE.Mesh(new THREE.IcosahedronGeometry(1.15, 1), meshMat);
root.add(hero);

const ringMat = new THREE.MeshBasicMaterial({ color: 0x9eb6ff, transparent: true, opacity: 0.45, side: THREE.DoubleSide });
const ring = new THREE.Mesh(new THREE.RingGeometry(1.55, 1.72, 64), ringMat);
ring.rotation.x = Math.PI / 2.4;
root.add(ring);

const torus = new THREE.Mesh(
  new THREE.TorusKnotGeometry(0.55, 0.16, 120, 16),
  new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.6, roughness: 0.25, emissive: 0x221133, emissiveIntensity: 0.2 })
);
torus.visible = false;
root.add(torus);

// Caption plane (canvas texture)
const textCanvas = document.createElement('canvas');
textCanvas.width = 1024;
textCanvas.height = 512;
const tctx = textCanvas.getContext('2d');
const textTex = new THREE.CanvasTexture(textCanvas);
textTex.colorSpace = THREE.SRGBColorSpace;
const caption = new THREE.Mesh(
  new THREE.PlaneGeometry(6.4, 3.2),
  new THREE.MeshBasicMaterial({ map: textTex, transparent: true })
);
caption.position.set(0, -2.05, 1.2);
scene.add(caption);

const badgeCanvas = document.createElement('canvas');
badgeCanvas.width = 512;
badgeCanvas.height = 128;
const bctx = badgeCanvas.getContext('2d');
const badgeTex = new THREE.CanvasTexture(badgeCanvas);
badgeTex.colorSpace = THREE.SRGBColorSpace;
const badge = new THREE.Mesh(
  new THREE.PlaneGeometry(2.4, 0.6),
  new THREE.MeshBasicMaterial({ map: badgeTex, transparent: true })
);
badge.position.set(-2.8, 2.35, 1.4);
scene.add(badge);

function drawCaption(text, palette, importance) {
  tctx.clearRect(0, 0, 1024, 512);
  tctx.fillStyle = 'rgba(0,0,0,0.28)';
  tctx.fillRect(40, 40, 944, 432);
  tctx.strokeStyle = palette.accent || '#6ea8ff';
  tctx.lineWidth = 4;
  tctx.strokeRect(40, 40, 944, 432);
  tctx.fillStyle = palette.text || '#ffffff';
  tctx.font = '700 42px Segoe UI, Helvetica Neue, Arial, sans-serif';
  tctx.textAlign = 'center';
  tctx.textBaseline = 'middle';
  const lines = wrapLines(tctx, text, 860, 5);
  const startY = 256 - (lines.length - 1) * 28;
  for (let i = 0; i < lines.length; i++) tctx.fillText(lines[i], 512, startY + i * 56);
  if (importance > 0.7) {
    tctx.fillStyle = palette.accent || '#6ea8ff';
    tctx.fillRect(220, 430, 584 * Math.min(1, importance), 6);
  }
  textTex.needsUpdate = true;
}

function drawBadge(label, palette) {
  bctx.clearRect(0, 0, 512, 128);
  bctx.fillStyle = 'rgba(0,0,0,0.35)';
  bctx.strokeStyle = palette.accent || '#6ea8ff';
  bctx.lineWidth = 3;
  bctx.fillRect(16, 28, 480, 72);
  bctx.strokeRect(16, 28, 480, 72);
  bctx.fillStyle = palette.muted || '#9eb6ff';
  bctx.font = '700 34px Segoe UI, Arial, sans-serif';
  bctx.textAlign = 'center';
  bctx.textBaseline = 'middle';
  bctx.fillText(String(label || '').toUpperCase(), 256, 64);
  badgeTex.needsUpdate = true;
}

function morphForMotif(motif) {
  root.remove(hero);
  hero.geometry.dispose?.();
  if (motif === 'rings' || motif === 'aurora') {
    hero = new THREE.Mesh(new THREE.TorusGeometry(1.05, 0.32, 24, 64), meshMat);
    torus.visible = true;
  } else if (motif === 'bars' || motif === 'waveform') {
    hero = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 1.6), meshMat);
    torus.visible = false;
  } else if (motif === 'constellation' || motif === 'grid') {
    hero = new THREE.Mesh(new THREE.OctahedronGeometry(1.25, 0), meshMat);
    torus.visible = false;
  } else {
    hero = new THREE.Mesh(new THREE.IcosahedronGeometry(1.15, 1), meshMat);
    torus.visible = motif === 'ribbons';
  }
  root.add(hero);
}

let lastMotif = null;
let lastTextKey = '';

window.renderAt = function renderAt(time) {
  const n = Number(time);
  if (!Number.isFinite(n)) throw new Error('renderAt: time must be a finite number, got ' + time);
  const t = clamp(n, 0, D);
  const shot = activeShot(t);
  const intent = (shot && shot.visualIntent) || {};
  const palette = intent.palette || { bg0: '#0b1220', bg1: '#151b3a', accent: '#6ea8ff', text: '#ffffff', muted: '#9eb6ff' };
  const motif = intent.motif || 'geometric';
  const p = localProgress(shot, t);
  const enter = easeOut(clamp(p / 0.25));

  scene.background = hexToColor(palette.bg1 || palette.bg0);
  meshMat.color = hexToColor(palette.accent);
  meshMat.emissive = hexToColor(palette.bg0);
  ringMat.color = hexToColor(palette.muted || palette.accent);
  rim.color = hexToColor(palette.accent);

  if (motif !== lastMotif) {
    morphForMotif(motif);
    lastMotif = motif;
  }

  const text = (shot && shot.text) || CFG.title || 'CliprPro';
  const textKey = text + '|' + (palette.accent || '') + '|' + (shot?.importance || 0);
  if (textKey !== lastTextKey) {
    drawCaption(text, palette, shot?.importance || 0.5);
    lastTextKey = textKey;
  }
  const badgeLabel = (intent.elements || []).find((e) => e.kind === 'badge')?.label || shot?.segmentType || 'SCENE';
  drawBadge(badgeLabel, palette);

  const cam = evalCamera(intent.camera, p, t);
  const zoom = cam.zoom;
  const panX = cam.panX;
  const panY = cam.panY;
  const roll = (cam.roll || 0) * Math.PI / 180;
  camera.fov = cam.fov || 45;
  camera.updateProjectionMatrix();
  camera.position.set(panX * 2.5, 0.35 + panY * 2, 7.2 / Math.max(0.75, zoom));
  camera.up.set(Math.sin(roll), Math.cos(roll), 0);
  camera.lookAt(0, 0, 0);

  const spin = t * (1.1 + (shot?.importance || 0.5) * 0.8);
  hero.rotation.set(spin * 0.7, spin, spin * 0.35);
  hero.scale.setScalar(0.85 + 0.25 * enter + 0.06 * Math.sin(t * 2.2));
  ring.rotation.z = t * 0.55;
  ring.scale.setScalar(0.9 + 0.2 * enter);
  torus.rotation.set(t * 1.3, t * 0.9, 0);
  torus.position.set(1.8, 0.6, 0);

  stars.rotation.y = t * 0.05;
  stars.material.opacity = 0.45 + 0.35 * (0.5 + 0.5 * Math.sin(t * 0.8));

  caption.material.opacity = 0.25 + 0.75 * enter;
  badge.material.opacity = enter;

  // Motion flavour
  const motion = intent.motion || 'rise';
  if (motion === 'impact') root.position.y = (1 - enter) * -0.6;
  else if (motion === 'orbit') root.position.set(Math.cos(t) * 0.25, Math.sin(t) * 0.15, 0);
  else if (motion === 'pulse') root.position.y = Math.sin(t * 3) * 0.08;
  else root.position.set(0, (1 - enter) * -0.35, 0);

  renderer.render(scene, camera);
  return t;
};

window.__scene = { name: 'threejs', durationSec: D, width: W, height: H, fps: CFG.fps, phase: 6 };
window.__sceneReady = true;
</script>
</body>
</html>
