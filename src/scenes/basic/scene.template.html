<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scene: basic</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
"use strict";
/*
 * BASIC SCENE (Phase 1)
 * Deterministic: every pixel is a pure function of `time` (seconds).
 * No Date.now(), no requestAnimationFrame, no Math.random() -> same time = same frame.
 * The renderer calls window.renderAt(time) and then captures the canvas.
 */
const CFG = __SCENE_CONFIG__;

const W = CFG.width, H = CFG.height, D = CFG.durationSec;
const DW = 1920, DH = 1080;               // design space; scaled to any 16:9 resolution
const FONT = "'Segoe UI', 'Helvetica Neue', Arial, sans-serif";

const canvas = document.getElementById('stage');
canvas.width = W;
canvas.height = H;
const ctx = canvas.getContext('2d');

// ---------- math helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function timecode(s) {
  const m = Math.floor(s / 60);
  const sec = s - m * 60;
  return String(m).padStart(2, '0') + ':' + sec.toFixed(2).padStart(5, '0');
}

// ---------- fixed (seeded) scene data ----------
const rng = mulberry32(CFG.seed === undefined ? 1234 : CFG.seed);
const STARS = Array.from({ length: 140 }, () => ({
  x: rng() * DW, y: rng() * DH, r: 0.6 + rng() * 1.8, ph: rng() * Math.PI * 2, sp: 0.5 + rng() * 1.5
}));

// ---------- timeline (adapts to audio duration) ----------
// Nominal marks 2s / 5s / 8s; compressed automatically for short audio.
const M0 = Math.min(2, D * 0.15);   // object appears and starts moving
const M1 = Math.min(5, D * 0.40);   // object changes direction/position
const M2 = Math.min(8, D * 0.65);   // second visual transition (orbit + colour change)
const MOVE = Math.max(0.3, Math.min(1.5, D * 0.12));

const A = { x: 360, y: 820 }, B = { x: 1560, y: 820 }, C = { x: 960, y: 700 };

function objectPosition(t) {
  if (t < M1) {
    const k = easeInOut(clamp((t - M0) / Math.max(1e-6, M1 - M0)));
    return { x: lerp(A.x, B.x, k), y: lerp(A.y, B.y, k) - Math.sin(k * Math.PI) * 120 };
  }
  if (t < M2) {
    const dur = Math.max(1e-6, Math.min(MOVE * 2, M2 - M1));
    const k = easeInOut(clamp((t - M1) / dur));
    return { x: lerp(B.x, C.x, k), y: lerp(B.y, C.y, k) };
  }
  const k = easeOut(clamp((t - M2) / MOVE));
  const r = 260 * k, a = (t - M2) * 1.4;
  return { x: C.x + Math.cos(a) * r, y: C.y + Math.sin(a) * r * 0.55 };
}

function objectHue(t) {
  const h1 = easeInOut(clamp((t - M1) / MOVE));
  const h2 = easeInOut(clamp((t - M2) / MOVE));
  return 200 + 80 * h1 + (40 - 280) * h2;      // 200 -> 280 -> 40
}

function hexagon(x, y, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = rot + (i * Math.PI) / 3;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

// ---------- drawing ----------
function drawBackground(t) {
  const p = D > 0 ? t / D : 0;
  const g = ctx.createLinearGradient(0, 0, 0, DH);
  g.addColorStop(0, 'hsl(' + (225 + 25 * p) + ', 45%, ' + (9 + 3 * Math.sin(t * 0.4)) + '%)');
  g.addColorStop(1, 'hsl(' + (260 + 30 * p) + ', 50%, 4%)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, DW, DH);

  for (const s of STARS) {
    const a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
    ctx.fillStyle = 'rgba(255,255,255,' + (a * 0.8).toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  const v = ctx.createRadialGradient(DW / 2, DH / 2, DH * 0.35, DW / 2, DH / 2, DH * 0.95);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, DW, DH);
}

function wrapText(text, maxWidth, font) {
  ctx.font = font;
  const words = String(text || '').split(/\s+/);
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = w;
    } else line = test;
  }
  if (line) lines.push(line);
  return lines.slice(0, 4);
}

function activeNarration(t) {
  const list = CFG.narration || [];
  for (let i = 0; i < list.length; i++) {
    if (t >= list[i].start && t < list[i].end) return list[i];
  }
  // last scene inclusive at end
  if (list.length && t >= list[list.length - 1].start) return list[list.length - 1];
  return null;
}

function activeSegment(t) {
  const list = CFG.segments || [];
  for (let i = 0; i < list.length; i++) {
    if (t >= list[i].start && t < list[i].end) return list[i];
  }
  if (list.length && t >= list[list.length - 1].start) return list[list.length - 1];
  return null;
}

function drawTexts(t) {
  const narr = activeNarration(t);
  const seg = activeSegment(t);
  const aTitle = easeOut(clamp((t - 0.15) / 0.8));

  // Title (first sentence / brand line)
  if (aTitle > 0 && !narr) {
    let size = 100;
    ctx.font = '700 ' + size + 'px ' + FONT;
    const w = ctx.measureText(CFG.title).width;
    if (w > 1600) { size = Math.floor((size * 1600) / w); ctx.font = '700 ' + size + 'px ' + FONT; }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = aTitle;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(CFG.title, DW / 2, 300 + (1 - aTitle) * 40);
    ctx.globalAlpha = 1;
  }

  // Phase 2: show active narration line from timeline
  if (narr && narr.text) {
    const font = '600 52px ' + FONT;
    const lines = wrapText(narr.text, 1600, font);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = 0.95;
    ctx.fillStyle = '#ffffff';
    ctx.font = font;
    const startY = 280 - (lines.length - 1) * 34;
    for (let i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], DW / 2, startY + i * 68);
    }
    ctx.globalAlpha = 1;
  } else if (CFG.subtitle) {
    const aSub = easeOut(clamp((t - 1.0) / 1.2));
    if (aSub > 0) {
      let size = 44;
      ctx.font = '400 ' + size + 'px ' + FONT;
      const w = ctx.measureText(CFG.subtitle).width;
      if (w > 1600) { size = Math.floor((size * 1600) / w); ctx.font = '400 ' + size + 'px ' + FONT; }
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.globalAlpha = aSub * 0.85;
      ctx.fillStyle = '#b9c4ff';
      ctx.fillText(CFG.subtitle, DW / 2, 395 + (1 - aSub) * 30);
      ctx.globalAlpha = 1;
    }
  }

  // Segment badge (hook / climax / …) — Phase 2 heuristic label
  if (seg && seg.type) {
    ctx.font = '600 22px ' + FONT;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = '#9eb6ff';
    ctx.fillText(String(seg.type).toUpperCase(), 80, 50);
    ctx.globalAlpha = 1;
  }
}

function drawObject(t) {
  if (t < M0) return;
  const hue = objectHue(t);
  const appear = easeOut(clamp((t - M0) / 0.5));
  const pulse = 1 + 0.35 * Math.sin(clamp((t - M2) / MOVE) * Math.PI);
  const rot = t * 0.9;

  // motion trail: the same pure function sampled at earlier times
  for (let i = 8; i >= 1; i--) {
    const tt = Math.max(M0, t - i * 0.05);
    const pos = objectPosition(tt);
    ctx.globalAlpha = (0.06 * (9 - i)) * appear;
    ctx.fillStyle = 'hsl(' + objectHue(tt) + ', 85%, 60%)';
    hexagon(pos.x, pos.y, 90 * appear * pulse * (1 - i * 0.04), tt * 0.9);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const p = objectPosition(t);
  const r = 90 * appear * pulse;
  ctx.shadowColor = 'hsl(' + hue + ', 90%, 60%)';
  ctx.shadowBlur = 40;
  const g = ctx.createLinearGradient(p.x - r, p.y - r, p.x + r, p.y + r);
  g.addColorStop(0, 'hsl(' + hue + ', 90%, 68%)');
  g.addColorStop(1, 'hsl(' + (hue + 40) + ', 85%, 45%)');
  ctx.fillStyle = g;
  hexagon(p.x, p.y, r, rot);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 4;
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.stroke();

  // inner triangle rotating the other way
  ctx.beginPath();
  for (let i = 0; i < 3; i++) {
    const a = -rot * 1.5 + (i * 2 * Math.PI) / 3;
    const px = p.x + Math.cos(a) * r * 0.5, py = p.y + Math.sin(a) * r * 0.5;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fill();
}

function drawOverlay(t) {
  // progress bar
  const x0 = 80, x1 = DW - 80, y = 1030;
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(x0, y, x1 - x0, 8);
  ctx.fillStyle = 'hsl(' + objectHue(Math.max(t, M0)) + ', 85%, 62%)';
  ctx.fillRect(x0, y, (x1 - x0) * (D > 0 ? t / D : 0), 8);
  // timecode
  ctx.font = '400 28px Consolas, "Courier New", monospace';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText(timecode(t) + ' / ' + timecode(D), DW - 80, 50);
  // fade out at the very end
  const fadeLen = Math.min(0.8, D * 0.1);
  const fo = clamp((t - (D - fadeLen)) / fadeLen);
  if (fo > 0) {
    ctx.fillStyle = 'rgba(0,0,0,' + fo.toFixed(4) + ')';
    ctx.fillRect(0, 0, DW, DH);
  }
}

/**
 * Render the exact visual state at `time` seconds.
 * @param {number} time seconds, clamped to [0, durationSec]
 */
window.renderAt = function renderAt(time) {
  const n = Number(time);
  if (!Number.isFinite(n)) throw new Error('renderAt: time must be a finite number, got ' + time);
  const t = clamp(n, 0, D);
  ctx.setTransform(W / DW, 0, 0, H / DH, 0, 0);
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.clearRect(0, 0, DW, DH);
  drawBackground(t);
  drawTexts(t);
  drawObject(t);
  drawOverlay(t);
  return t;
};

window.__scene = { name: 'basic', durationSec: D, width: W, height: H, fps: CFG.fps };
window.__sceneReady = true;
</script>
</body>
</html>
