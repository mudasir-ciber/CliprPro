<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scene: storyboard (Phase 4+6)</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
"use strict";
/*
 * STORYBOARD SCENE — Phase 4 Advanced 2D + Phase 6 cinematic camera
 * Deterministic: pure function of time + CFG.shots[].visualIntent
 * Motifs / transitions / typography / fx / camera moves — no wall-clock or unseeded RNG
 */
const CFG = __SCENE_CONFIG__;
const W = CFG.width, H = CFG.height, D = CFG.durationSec;
const DW = 1920, DH = 1080;
const FONT = "'Segoe UI', 'Helvetica Neue', Arial, sans-serif";
const canvas = document.getElementById('stage');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d');

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeIn = (t) => t * t * t;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function timecode(s) {
  const m = Math.floor(s / 60);
  const sec = s - m * 60;
  return String(m).padStart(2, '0') + ':' + sec.toFixed(2).padStart(5, '0');
}
function wrapText(text, maxWidth, font) {
  ctx.font = font;
  const words = String(text || '').split(/\s+/);
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines.slice(0, 5);
}
function hexAlpha(hex, a) {
  const h = String(hex || '#ffffff').replace('#', '');
  const full = h.length === 3 ? h.split('').map((c) => c + c).join('') : h;
  const r = parseInt(full.slice(0, 2), 16) || 0;
  const g = parseInt(full.slice(2, 4), 16) || 0;
  const b = parseInt(full.slice(4, 6), 16) || 0;
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}
function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

const rng = mulberry32(CFG.seed === undefined ? 42 : CFG.seed);
const PARTICLES = Array.from({ length: 110 }, () => ({
  x: rng() * DW, y: rng() * DH, r: 0.7 + rng() * 2.4, ph: rng() * Math.PI * 2, sp: 0.35 + rng() * 1.7, layer: rng() > 0.55 ? 1 : 0
}));
const STARS = Array.from({ length: 48 }, () => ({
  x: rng() * DW, y: rng() * DH * 0.7, r: 1 + rng() * 2.5, ph: rng() * Math.PI * 2
}));

const DEFAULT_PALETTE = { bg0: '#0b1220', bg1: '#151b3a', accent: '#6ea8ff', text: '#ffffff', muted: '#9eb6ff' };

function activeShot(t) {
  const list = CFG.shots || [];
  for (let i = 0; i < list.length; i++) {
    if (t >= list[i].start && t < list[i].end) return { shot: list[i], index: i };
  }
  if (list.length && t >= list[list.length - 1].start) return { shot: list[list.length - 1], index: list.length - 1 };
  return { shot: null, index: -1 };
}

function localProgress(shot, t) {
  if (!shot) return 0;
  const dur = Math.max(1e-6, shot.end - shot.start);
  return clamp((t - shot.start) / dur);
}

function transitionAlpha(name, p) {
  const enter = clamp(p / 0.22);
  const exit = clamp((1 - p) / 0.18);
  const gate = Math.min(easeOut(enter), easeOut(exit));
  switch (name) {
    case 'zoom-punch': return easeOut(clamp(p / 0.15)) * easeOut(exit);
    case 'glitch-snap': return gate > 0.08 ? gate : gate * 0.3;
    case 'wipe-soft': return easeInOut(enter) * easeOut(exit);
    case 'slide-stack': return easeOut(enter) * easeOut(exit);
    case 'rise-blur': return easeOut(enter) * easeOut(exit);
    case 'soft-fade':
    default: return gate;
  }
}

function transitionOffset(name, p, t) {
  const enter = easeOut(clamp(p / 0.28));
  switch (name) {
    case 'zoom-punch': return { x: 0, y: (1 - enter) * 40, s: 0.88 + 0.14 * enter };
    case 'slide-stack': return { x: (1 - enter) * -120, y: 0, s: 1 };
    case 'wipe-soft': return { x: (1 - enter) * 80, y: 0, s: 1 };
    case 'rise-blur': return { x: 0, y: (1 - enter) * 70, s: 0.97 + 0.03 * enter };
    case 'glitch-snap': {
      const j = (p < 0.12 || p > 0.88) ? Math.sin(t * 40) * 10 : 0;
      return { x: j, y: -j * 0.3, s: 1 };
    }
    case 'soft-fade':
    default: return { x: 0, y: (1 - enter) * 28, s: 1 };
  }
}

function motionOffset(motion, p, t) {
  switch (motion) {
    case 'impact': return { x: (1 - easeOut(clamp(p * 3))) * -36, y: (1 - easeOut(clamp(p * 3))) * 24, s: 0.94 + 0.1 * easeOut(clamp(p * 2.5)) };
    case 'pulse': return { x: 0, y: Math.sin(t * 3) * 8, s: 1 + 0.045 * Math.sin(t * 4) };
    case 'orbit': return { x: Math.cos(t * 1.2) * 26, y: Math.sin(t * 1.2) * 14, s: 1 };
    case 'sweep': return { x: lerp(-50, 0, easeOut(p)), y: 0, s: 1 };
    case 'fade': return { x: 0, y: 18 * (1 - easeOut(p)), s: 1 };
    case 'rise':
    default: return { x: 0, y: lerp(44, 0, easeOut(p)), s: lerp(0.97, 1, easeOut(p)) };
  }
}

function typeSpec(style) {
  switch (style) {
    case 'bold-impact': return { weight: '800', size: 68, tracking: 0.5, transform: 'none' };
    case 'editorial': return { weight: '500', size: 52, tracking: 0.2, transform: 'none' };
    case 'mono-tech': return { weight: '600', size: 46, tracking: 1.2, transform: 'uppercase', family: 'Consolas, "Courier New", monospace' };
    case 'display':
    default: return { weight: '700', size: 56, tracking: 0.3, transform: 'none' };
  }
}

function easeCamera(t, name) {
  const x = clamp(t);
  if (name === 'linear') return x;
  if (name === 'ease-in') return x * x * x;
  if (name === 'ease-out') return 1 - Math.pow(1 - x, 3);
  return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
}

function evalCamera(cam, p, t) {
  cam = cam || {};
  const move = cam.move || 'static';
  const easeName = cam.ease || 'ease-in-out';
  const intensity = Number.isFinite(cam.intensity) ? cam.intensity : 0.5;
  const e = easeCamera(p, easeName);
  let zoom = Number.isFinite(cam.zoom) ? cam.zoom : 1;
  let panX = Number.isFinite(cam.panX) ? cam.panX : 0;
  let panY = Number.isFinite(cam.panY) ? cam.panY : 0;
  let roll = Number.isFinite(cam.roll) ? cam.roll : 0;
  const baseZoom = zoom, basePanX = panX, basePanY = panY, baseRoll = roll;
  const k = intensity;
  if (cam.from && cam.to) {
    const a = cam.from, b = cam.to;
    const L = (u, v, w) => (Number.isFinite(u) ? u : w) + ((Number.isFinite(v) ? v : w) - (Number.isFinite(u) ? u : w)) * e;
    return { zoom: L(a.zoom, b.zoom, baseZoom), panX: L(a.panX, b.panX, basePanX), panY: L(a.panY, b.panY, basePanY), roll: L(a.roll, b.roll, baseRoll) };
  }
  if (move === 'dolly-in') zoom = lerp(baseZoom * (1 - 0.12 * k), baseZoom * (1 + 0.14 * k), e);
  else if (move === 'dolly-out') zoom = lerp(baseZoom * (1 + 0.1 * k), baseZoom * (1 - 0.1 * k), e);
  else if (move === 'orbit-left') { panX = basePanX + lerp(0.08 * k, -0.08 * k, e); panY = basePanY + Math.sin(e * Math.PI) * 0.02 * k; }
  else if (move === 'orbit-right') { panX = basePanX + lerp(-0.08 * k, 0.08 * k, e); panY = basePanY + Math.sin(e * Math.PI) * 0.02 * k; }
  else if (move === 'crane-up') { panY = basePanY + lerp(0.06 * k, -0.07 * k, e); zoom = lerp(baseZoom * 0.98, baseZoom * 1.04, e); }
  else if (move === 'crane-down') panY = basePanY + lerp(-0.05 * k, 0.06 * k, e);
  else if (move === 'handheld') {
    panX = basePanX + Math.sin(t * 7.3) * 0.012 * k + Math.sin(t * 3.1) * 0.006 * k;
    panY = basePanY + Math.cos(t * 6.1) * 0.01 * k;
    roll = baseRoll + Math.sin(t * 5.2) * 0.8 * k;
    zoom = baseZoom * (1 + Math.sin(t * 4.4) * 0.01 * k);
  } else if (move === 'push-slide') {
    panX = basePanX + lerp(-0.05 * k, 0.04 * k, e);
    zoom = lerp(baseZoom * 0.97, baseZoom * 1.06, e);
  } else if (move === 'whip-pan') {
    panX = basePanX + ((e < 0.15 || e > 0.85) ? Math.sin(t * 30) * 0.04 * k : lerp(-0.12 * k, 0.12 * k, e));
    roll = baseRoll + (e < 0.2 ? (1 - e / 0.2) * 3 * k : 0);
  }
  return { zoom, panX, panY, roll };
}

function drawBackground(t, palette, fx, parallax) {
  const g = ctx.createLinearGradient(0, 0, DW * 0.2, DH);
  g.addColorStop(0, palette.bg0);
  g.addColorStop(1, palette.bg1);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, DW, DH);

  const px = parallax ? parallax.x : 0;
  const py = parallax ? parallax.y : 0;
  for (const s of PARTICLES) {
    const depth = s.layer ? 1.4 : 0.7;
    const a = 0.2 + 0.5 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
    ctx.fillStyle = hexAlpha(palette.accent, a * (s.layer ? 0.45 : 0.28));
    ctx.beginPath();
    ctx.arc(s.x + px * depth + Math.sin(t * 0.25 + s.ph) * 8, s.y + py * depth, s.r, 0, Math.PI * 2);
    ctx.fill();
  }

  const cx = DW * (0.5 + 0.06 * Math.sin(t * 0.45)) + px * 1.2;
  const cy = DH * (0.42 + 0.04 * Math.cos(t * 0.35)) + py;
  const rg = ctx.createRadialGradient(cx, cy, 30, cx, cy, 760);
  rg.addColorStop(0, hexAlpha(palette.accent, fx.includes('glow') ? 0.38 : 0.18));
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, DW, DH);
}

function drawMotif(motif, palette, t, strength, layout) {
  const s = 0.5 + (strength || 0.5) * 0.5;
  ctx.save();
  if (layout === 'split-focus') ctx.translate(1380, 560);
  else if (layout === 'callout') ctx.translate(960, 700);
  else if (layout === 'title-hero') ctx.translate(960, 760);
  else if (layout === 'closing') ctx.translate(960, 760);
  else ctx.translate(960, 620);
  ctx.scale(s, s);

  if (motif === 'waveform') {
    ctx.strokeStyle = hexAlpha(palette.accent, 0.85);
    ctx.lineWidth = 4;
    ctx.beginPath();
    for (let x = -420; x <= 420; x += 8) {
      const y = Math.sin(x * 0.02 + t * 3) * 50 + Math.sin(x * 0.05 + t * 1.7) * 22;
      if (x === -420) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  } else if (motif === 'constellation') {
    ctx.fillStyle = palette.accent;
    for (const st of STARS) {
      const a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 1.5 + st.ph));
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc((st.x - DW / 2) * 0.45, (st.y - DH * 0.2) * 0.45, st.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = palette.muted;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * Math.PI * 2 + t * 0.2;
      const x = Math.cos(a) * 180, y = Math.sin(a) * 100;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.globalAlpha = 1;
  } else if (motif === 'grid') {
    ctx.strokeStyle = hexAlpha(palette.accent, 0.22);
    ctx.lineWidth = 1.5;
    for (let i = -5; i <= 5; i++) {
      ctx.beginPath(); ctx.moveTo(i * 70, -260); ctx.lineTo(i * 70, 260); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-320, i * 50); ctx.lineTo(320, i * 50); ctx.stroke();
    }
    ctx.strokeStyle = palette.accent;
    ctx.globalAlpha = 0.7;
    ctx.strokeRect(-160, -90, 320, 180);
    ctx.globalAlpha = 1;
  } else if (motif === 'ribbons') {
    for (let i = 0; i < 4; i++) {
      ctx.strokeStyle = hexAlpha(palette.accent, 0.35 + i * 0.12);
      ctx.lineWidth = 10 - i * 1.5;
      ctx.beginPath();
      for (let x = -400; x <= 400; x += 10) {
        const y = Math.sin(x * 0.01 + t * 1.2 + i) * (70 + i * 18) + i * 20;
        if (x === -400) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  } else if (motif === 'rings') {
    if (fxGlow()) ctx.shadowColor = palette.accent, ctx.shadowBlur = 28;
    ctx.strokeStyle = palette.accent;
    for (let i = 1; i <= 5; i++) {
      ctx.globalAlpha = 0.25 + i * 0.1;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(0, 0, 50 * i + Math.sin(t * 2 + i) * 6, 28 * i + Math.cos(t * 2 + i) * 4, t * 0.15, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  } else if (motif === 'bars') {
    for (let i = 0; i < 16; i++) {
      const h = 40 + (0.5 + 0.5 * Math.sin(t * 4 + i * 0.7)) * 160;
      ctx.fillStyle = hexAlpha(palette.accent, 0.35 + (i % 3) * 0.15);
      ctx.fillRect(-280 + i * 36, -h / 2, 22, h);
    }
  } else if (motif === 'aurora') {
    for (let i = 0; i < 5; i++) {
      const gg = ctx.createLinearGradient(-300, -200, 300, 200);
      gg.addColorStop(0, 'rgba(0,0,0,0)');
      gg.addColorStop(0.5, hexAlpha(palette.accent, 0.22 - i * 0.03));
      gg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gg;
      ctx.beginPath();
      ctx.ellipse(Math.sin(t + i) * 40, Math.cos(t * 0.7 + i) * 20, 340 - i * 30, 120 - i * 12, 0.4 + i * 0.1, 0, Math.PI * 2);
      ctx.fill();
    }
  } else {
    // geometric
    if (fxGlow()) ctx.shadowColor = palette.accent, ctx.shadowBlur = 30;
    ctx.fillStyle = palette.accent;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = t * 0.8 + i * Math.PI / 3;
      const x = Math.cos(a) * 110, y = Math.sin(a) * 110;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      const a = -t * 1.3 + i * Math.PI * 2 / 3;
      const x = Math.cos(a) * 48, y = Math.sin(a) * 48;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  function fxGlow() { return true; }
}

function drawBadge(label, x, y, palette) {
  ctx.font = '700 22px ' + FONT;
  const padX = 18, padY = 10;
  const tw = ctx.measureText(label).width;
  const w = tw + padX * 2, h = 22 + padY * 2;
  ctx.fillStyle = hexAlpha(palette.accent, 0.18);
  ctx.strokeStyle = palette.accent;
  ctx.lineWidth = 2;
  roundRectPath(x, y, w, h, 8);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = palette.muted;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x + padX, y + h / 2);
}

function drawNarration(shot, palette, layout, offset, alpha, typography) {
  const text = shot.text || '';
  if (!text) return;
  const spec = typeSpec(typography || 'display');
  const maxW = layout === 'split-focus' ? 920 : 1520;
  const size = layout === 'title-hero' ? spec.size + 10 : layout === 'callout' ? spec.size + 4 : spec.size;
  const family = spec.family || FONT;
  const font = spec.weight + ' ' + size + 'px ' + family;
  let display = text;
  if (spec.transform === 'uppercase') display = text.toUpperCase();
  const lines = wrapText(display, maxW, font);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = palette.text;
  ctx.font = font;
  ctx.textBaseline = 'middle';

  let x = DW / 2 + offset.x;
  let y = (layout === 'closing' ? 500 : 340) + offset.y;
  ctx.textAlign = 'center';
  if (layout === 'split-focus') { x = 200 + offset.x; y = 330 + offset.y; ctx.textAlign = 'left'; }
  if (layout === 'callout') y = 280 + offset.y;

  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], x, y + i * (size + 16) * offset.s);
  }

  const emp = shot.visualIntent && shot.visualIntent.emphasis && shot.visualIntent.emphasis[0];
  if (emp && lines[0]) {
    ctx.strokeStyle = palette.accent;
    ctx.globalAlpha = alpha * 0.9;
    ctx.lineWidth = 4;
    const w = Math.min(ctx.measureText(lines[0]).width, maxW);
    const x0 = ctx.textAlign === 'left' ? x : x - w / 2;
    ctx.beginPath();
    ctx.moveTo(x0, y + size * 0.58);
    ctx.lineTo(x0 + w * 0.55, y + size * 0.58);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawVignette(fx) {
  if (!fx.includes('vignette')) return;
  const v = ctx.createRadialGradient(DW / 2, DH / 2, DH * 0.25, DW / 2, DH / 2, DH * 0.95);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, DW, DH);
}

function drawScan(fx, t) {
  if (!fx.includes('scan')) return;
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  for (let y = (Math.floor(t * 40) % 6); y < DH; y += 6) ctx.fillRect(0, y, DW, 2);
}

function drawOverlay(t, palette, shot) {
  const x0 = 80, x1 = DW - 80, y = 1030;
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(x0, y, x1 - x0, 8);
  ctx.fillStyle = palette.accent;
  ctx.fillRect(x0, y, (x1 - x0) * (D > 0 ? t / D : 0), 8);

  ctx.font = '400 24px Consolas, "Courier New", monospace';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText(timecode(t) + ' / ' + timecode(D), DW - 80, 48);

  if (shot && shot.visualIntent) {
    const vi = shot.visualIntent;
    ctx.textAlign = 'left';
    ctx.fillStyle = palette.muted;
    ctx.font = '600 18px ' + FONT;
    const bits = [vi.mood, vi.layout, vi.motif, vi.transition, vi.camera && vi.camera.move].filter(Boolean).map((s) => String(s).toUpperCase());
    ctx.fillText(bits.join(' · '), 80, 100);
  }

  const fadeLen = Math.min(0.7, D * 0.08);
  const fo = clamp((t - (D - fadeLen)) / fadeLen);
  if (fo > 0) {
    ctx.fillStyle = 'rgba(0,0,0,' + fo.toFixed(4) + ')';
    ctx.fillRect(0, 0, DW, DH);
  }
}

window.renderAt = function renderAt(time) {
  const n = Number(time);
  if (!Number.isFinite(n)) throw new Error('renderAt: time must be a finite number, got ' + time);
  const t = clamp(n, 0, D);
  const { shot } = activeShot(t);
  const intent = (shot && shot.visualIntent) || {};
  const palette = intent.palette || DEFAULT_PALETTE;
  const layout = intent.layout || 'center-focus';
  const motion = intent.motion || 'rise';
  const motif = intent.motif || 'geometric';
  const transition = intent.transition || 'soft-fade';
  const typography = intent.typography || 'display';
  const fx = Array.isArray(intent.fx) ? intent.fx : ['glow', 'vignette'];
  const p = localProgress(shot, t);
  const alpha = transitionAlpha(transition, p);
  const toff = transitionOffset(transition, p, t);
  const moff = motionOffset(motion, p, t);
  const offset = { x: toff.x + moff.x, y: toff.y + moff.y, s: toff.s * moff.s };
  const cam = evalCamera(intent.camera, p, t);
  const zoom = cam.zoom;
  const panX = cam.panX * DW;
  const panY = cam.panY * DH;
  const roll = (cam.roll || 0) * Math.PI / 180;
  const parallax = fx.includes('parallax')
    ? { x: Math.sin(t * 0.4) * 12 + panX * 0.15, y: Math.cos(t * 0.35) * 8 + panY * 0.15 }
    : { x: 0, y: 0 };

  ctx.setTransform(W / DW, 0, 0, H / DH, 0, 0);
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.clearRect(0, 0, DW, DH);

  ctx.save();
  ctx.translate(DW / 2 + panX, DH / 2 + panY);
  ctx.rotate(roll);
  ctx.scale(zoom, zoom);
  ctx.translate(-DW / 2, -DH / 2);

  drawBackground(t, palette, fx, parallax);

  if (shot) {
    ctx.globalAlpha = alpha;
    drawMotif(motif, palette, t, shot.importance || 0.5, layout);
    ctx.globalAlpha = 1;

    const badge = (intent.elements || []).find((e) => e.kind === 'badge');
    if (badge && badge.label) {
      ctx.globalAlpha = alpha;
      drawBadge(badge.label, layout === 'split-focus' ? 200 : 80, 150, palette);
      ctx.globalAlpha = 1;
    }

    drawNarration(shot, palette, layout, offset, alpha, typography);

    const kw = (intent.elements || []).find((e) => e.kind === 'keyword');
    if (kw && kw.text) {
      ctx.globalAlpha = alpha * 0.92;
      ctx.font = '800 26px ' + FONT;
      ctx.fillStyle = palette.accent;
      ctx.textAlign = 'center';
      ctx.fillText(String(kw.text).toUpperCase(), DW / 2 + offset.x * 0.4, 910 + offset.y * 0.2);
      ctx.globalAlpha = 1;
    }
  } else {
    ctx.fillStyle = '#fff';
    ctx.font = '700 72px ' + FONT;
    ctx.textAlign = 'center';
    ctx.fillText(CFG.title || 'CliprPro', DW / 2, DH / 2);
  }

  drawVignette(fx);
  drawScan(fx, t);
  ctx.restore();
  drawOverlay(t, palette, shot);
  return t;
};

window.__scene = { name: 'storyboard', durationSec: D, width: W, height: H, fps: CFG.fps, phase: 6 };
window.__sceneReady = true;
</script>
